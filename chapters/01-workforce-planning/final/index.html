  <style>

  <script>
    window.__CAPTION_GROUPS = [{"text": "좋은 하루 되시길 빕니다", "start": 0.0, "end": 3.42}, {"text": "오늘 시간에는 정원 산정 흔히 적정 인력 관련된", "start": 4.2, "end": 7.48}, {"text": "이야기를 기존에 했던 재래식 방식이 어떻게 굴러 갔는지", "start": 7.48, "end": 12.3}, {"text": "다음에 ai hr을 도입한 쉐막을 가지고 도입하면", "start": 12.3, "end": 17.44}, {"text": "어떤 모양을 지내게 되는지를 나누어서 설명 드리고자 합니다", "start": 17.44, "end": 21.44}, {"text": "지금 보시는 화면이 전형적으로 저희가 레거시 방식으로 했던", "start": 22.12, "end": 26.52}, {"text": "인력 산정 방식입니다", "start": 26.52, "end": 28.06}, {"text": "첫 번째로는 모든 구성원들한테 혹은 모든 조직한테 양식을", "start": 28.58, "end": 33.8}, {"text": "나눠 드려서 인력 동인이 무엇인가 그리고 최근 3년간", "start": 33.8, "end": 37.94}, {"text": "혹은 1년간 이 인력 동인 이 어떠한 값을", "start": 37.94, "end": 41.82}, {"text": "보였는가와 몇 시간을 투입했는가를 다 작성하게 합니다", "start": 41.82, "end": 45.88}, {"text": "두 번째로는 이게 실제 업무량과 어떻게 되는지를 분석하는", "start": 46.26, "end": 50.2}, {"text": "업무량 진단이 이루어지게 되고요", "start": 50.2, "end": 52.26}, {"text": "세 번째로는 그 당시에 썼던 비용 그리고 향후에", "start": 52.26, "end": 56.44}, {"text": "우리가 지불 가능한 인건비 영업이익 대비 인건비율 등등을", "start": 56.44, "end": 60.48}, {"text": "정한 다음에 최종적으로 는 적정한 인력 안이 어떻다를", "start": 60.48, "end": 65.0}, {"text": "산출 해 나가는 구조를 지니게 됩니다", "start": 65.0, "end": 67.1}, {"text": "그 결과 지금 두 번째 화면에 보시는 것처럼", "start": 67.88, "end": 70.28}, {"text": "각 조직별로 혹은 파트별로 기능별로 현재 인원과 향후에", "start": 70.28, "end": 76.32}, {"text": "필요한 인원 그다음에 업무량의 증강 요소 등을 종합적으로", "start": 76.32, "end": 79.53999999999999}, {"text": "고려해서 인력이 향후에 몇 명이 필요하겠구나라는 마테리어를 만들어서", "start": 79.53999999999999, "end": 84.8}, {"text": "보고하게 되는 구조입니다", "start": 84.8, "end": 85.98}, {"text": "전형적으로 특정 시점에 한 번의 조사를 통해서 다음", "start": 86.56, "end": 90.92}, {"text": "필요한 시기의 인력이 얼마나 소요되는가를 예측 해 나가는", "start": 90.92, "end": 94.8}, {"text": "방식이라고 본다면 지금 보시는 화면은 각 조직별로 직급", "start": 94.8, "end": 101.62}, {"text": "별로 매월 혹은 특정 연도의 다음", "start": 101.62, "end": 105.41}, {"text": "시기에 몇 명이 필요한가를 예측 해 나가는 방식입니다", "start": 105.41, "end": 108.27000000000001}, {"text": "먼저 지금 보시는 화면은 전사의 인력들이 과거의 전사인력들이", "start": 108.81, "end": 116.35}, {"text": "변수별로 인력 동인입니다", "start": 116.35, "end": 118.13}, {"text": "인력 동인별로 전사인력의 어떠한 회귀관계를 보여주는가를 설명 하게", "start": 118.27000000000001, "end": 124.45}, {"text": "되고요 이게 각 부서별로도 다시 한 번 브레이크", "start": 124.45, "end": 127.37}, {"text": "다운되게 됩니다", "start": 127.37, "end": 128.03}, {"text": "그래서 특정한 부서에 예를 들면 지금 보시는 화면처럼", "start": 129.09, "end": 132.93}, {"text": "특정한 부서 의 특정팀의 인력 동인을 현재 업무", "start": 132.93, "end": 139.43}, {"text": "매뉴얼이라든지 현재 쓰고 있는 구성원들의 인터뷰 결과들 토대로", "start": 139.43, "end": 145.71}, {"text": "인력 동인들 피처값을 찾아 냅니다", "start": 145.71, "end": 149.53}, {"text": "그리고 그걸 과거 데이터 3년치를 모아서 회귀관계를 찾아", "start": 150.05, "end": 154.61}, {"text": "냅니다 그리고 또 하나는 이게 부서 내에 있는", "start": 154.61, "end": 158.19}, {"text": "깜뿐만이 아니고요", "start": 158.19, "end": 159.75}, {"text": "이 부서와 전후에 있는 부서들의 지표 간의 연관관계도", "start": 159.75, "end": 165.59}, {"text": "동시에 ai가 일종의 알고리즘을 발굴해서 예측 하게 됩니다", "start": 165.59, "end": 170.73}, {"text": "이때 대부분 결측치가 무척 문제가 되게 됩니다", "start": 171.17000000000002, "end": 174.71}, {"text": "즉 모든 프로세스나 지표별로 완벽히 데이터가 다 있어야", "start": 175.85, "end": 178.91}, {"text": "되는데 그게 다 모자라게 되는 상황이 많이 발생", "start": 178.91, "end": 181.77}, {"text": "하게 되는 거죠", "start": 181.77, "end": 182.45}, {"text": "그래서 쉐막은 모자란 부분 즉 결측치를 정확히 예측해서", "start": 182.95, "end": 189.15}, {"text": "좀 더 설명 가능성을 높여주는데 초점을 맞추고 있다고", "start": 189.15, "end": 193.13}, {"text": "보시면 됩니다", "start": 193.13, "end": 193.83}, {"text": "그 결과 지금 보시는 화면처럼 이 특정한 팀은", "start": 194.31, "end": 197.97}, {"text": "지표가 지금 보시는 화면처럼 움직일 경우에 인원이 어떻게", "start": 197.97, "end": 205.11}, {"text": "가운데 세 번째에 있는 지표가 증가 하게 되면", "start": 205.11, "end": 207.87}, {"text": "인력 예측이 어떻게 바뀔 것인가를 다음", "start": 207.87, "end": 211.05}, {"text": "달 혹은 다음", "start": 211.05, "end": 211.82999999999998}, {"text": "분기 내년에 어떻게 될 것인가를 예측하게 됩니다", "start": 211.82999999999998, "end": 214.69}, {"text": "이거를 전체적으로 종합을 하면 지금 보신 화면처럼 내년도에는", "start": 215.55, "end": 219.69}, {"text": "전사가 몇 명이 필요하겠구나 혹은 다음", "start": 219.69, "end": 222.51}, {"text": "분기에는 다음", "start": 222.51, "end": 223.85}, {"text": "반기에는 혹은", "start": 223.85, "end": 224.97}, {"text": "특정한 요인들이 인력 동인들이 변경되게 되면 몇 명이", "start": 225.99, "end": 230.13}, {"text": "필요할까를 예측하게 됩니다", "start": 230.13, "end": 231.32999999999998}, {"text": "이게 쉐막이 제공하는 기존의 재래식 방식과 좀 다", "start": 232.19, "end": 235.82999999999998}, {"text": "차별화된 방법론 이라고 설명을 드릴 수가 있겠습니다", "start": 235.82999999999998, "end": 238.93}, {"text": "감사합니다", "start": 239.47, "end": 239.75}];
  </script>
  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    // PIP entry — settles by ~1.4s
    tl.from("#pip-frame", { scale: 0.7, opacity: 0, duration: 0.6, ease: "power2.out" }, 0.8);

    // Slide crossfades (next slide fades in over 0.4s at its data-start).
    tl.from("#s2",  { opacity: 0, duration: 0.4, ease: "none" }, 72);
    tl.from("#s3",  { opacity: 0, duration: 0.4, ease: "none" }, 102);
    tl.from("#s4",  { opacity: 0, duration: 0.4, ease: "none" }, 117);
    tl.from("#s5",  { opacity: 0, duration: 0.4, ease: "none" }, 136);
    tl.from("#s6a", { opacity: 0, duration: 0.4, ease: "none" }, 139);
    tl.from("#s6b", { opacity: 0, duration: 0.4, ease: "none" }, 143);
    tl.from("#s6c", { opacity: 0, duration: 0.4, ease: "none" }, 176);
    tl.from("#s6d", { opacity: 0, duration: 0.4, ease: "none" }, 202);
    tl.from("#s7a", { opacity: 0, duration: 0.4, ease: "none" }, 222);
    tl.from("#s7b", { opacity: 0, duration: 0.4, ease: "none" }, 239);

    // Captions: inject DOM + opacity-only toggle on the same timeline.
    const groups = window.__CAPTION_GROUPS || [];
    const capRoot = document.getElementById("captions");
    groups.forEach((g, i) => {
      const row = document.createElement("div");
      row.id = "cg-" + i;
      row.className = "caption-row";
      const inner = document.createElement("span");
      inner.className = "caption-group";
      inner.textContent = g.text;
      row.appendChild(inner);
      capRoot.appendChild(row);
    });
    groups.forEach((g, i) => {
      const sel = "#cg-" + i;
      tl.set(sel, { opacity: 1 }, g.start);
      tl.set(sel, { opacity: 0 }, g.end);
    });

    window.__timelines["ch01"] = tl;
  </script>
</div>
