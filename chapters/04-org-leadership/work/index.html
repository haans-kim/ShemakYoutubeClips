<!doctype html>

  <style>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    window.__CAPTION_GROUPS = [{"text": "좋은 날 되시길 바랍니다", "start": 0.0, "end": 2.0999999046325684}, {"text": "오늘은 조직 진단 즉 과거에는 주로 기술 통계", "start": 2.740000009536743, "end": 6.579999923706055}, {"text": "중심으로 조직 진단을 해왔는데 그 조직 진단과 쉐막이", "start": 6.579999923706055, "end": 11.460000038146973}, {"text": "예측하는 방식이 어떻게 다른지를 보여드리려고 시간을 마련했습니다", "start": 11.460000038146973, "end": 15.899999618530273}, {"text": "지금 보신 화면이 전형적으로 저희가 조직 진단할 때", "start": 16.479999542236328, "end": 20.079999923706055}, {"text": "쓰고 있는 프레임워크라고 보시면 됩니다", "start": 20.079999923706055, "end": 21.940000534057617}, {"text": "왼쪽에 보시는 게 인풋 요소로서 가치가 얼마나 잘", "start": 22.84000015258789, "end": 26.899999618530273}, {"text": "내재화되어 있는가 가운데는 스루풋이라고 표현하죠", "start": 26.899999618530273, "end": 30.639999389648438}, {"text": "가치를 실천하고 있는 환경이 얼마나 잘 구성원들을 만족시키고", "start": 31.0, "end": 35.060001373291016}, {"text": "있는가 그 결과 제일 오른쪽에 보이시는 것처럼 조직", "start": 35.060001373291016, "end": 40.31999969482422}, {"text": "몰입으로 연결됩니다", "start": 40.31999969482422, "end": 41.2400016784668}, {"text": "즉 이게 최종적인 종속 변수죠", "start": 41.5, "end": 43.599998474121094}, {"text": "조직 몰입도를 높이는 게 사실은 모든 인사관리 담당자", "start": 44.099998474121094, "end": 47.599998474121094}, {"text": "혹은 리더들이 해야 될 일이라고 보고 있습니다", "start": 47.599998474121094, "end": 49.41999816894531}, {"text": "이 틀대로 실제로 서베이를 저희가 오랫동안 했는데", "start": 50.099998474121094, "end": 53.81999969482422}, {"text": "전형적인 보고서를 생성하는 방식은 지금 보시는 화면과 같습니다", "start": 54.41999816894531, "end": 58.70000076293945}, {"text": "위에 몰입도가 있죠", "start": 59.5, "end": 60.619998931884766}, {"text": "몰입도의 절대 점수하고 특정 시점에 다른 회사들이 갖고", "start": 61.220001220703125, "end": 67.16000366210938}, {"text": "있는 점수랑 비교를 하게 됩니다", "start": 67.16000366210938, "end": 68.5999984741211}, {"text": "놈이 있는 거죠", "start": 68.83999633789062, "end": 69.58000183105469}, {"text": "인사이트룸 기본적으로 매년 약 10만여 명이 서베이를 하고", "start": 69.9800033569336, "end": 74.36000061035156}, {"text": "있습니다 영역별로 비교 집단인 놈이 존재합니다", "start": 74.36000061035156, "end": 78.05999755859375}, {"text": "그래서 보시는 것처럼 각 소분류별로 문항별로 비교군 대비", "start": 78.05999755859375, "end": 83.86000061035156}, {"text": "어떠한가 전년대비 어떠한가라는 차이를 먼저 분석을 하고요", "start": 83.86000061035156, "end": 88.58000183105469}, {"text": "다음에 두 가지를 분석합니다", "start": 88.58000183105469, "end": 89.81999969482422}, {"text": "상관과 회기를 분석합니다", "start": 90.08000183105469, "end": 91.5}, {"text": "몰입도와 예를 들면 왼쪽에 있는 조직 가치의 세부", "start": 92.77999877929688, "end": 96.31999969482422}, {"text": "항목들이 비교군 대비는 어떠하고 전년대비는 어떠하고 몰입도와 상관계수는", "start": 96.31999969482422, "end": 102.19999694824219}, {"text": "어떠한가 등등을 파악을 해서 의미 있는 영역들을 찾아내어서", "start": 102.19999694824219, "end": 107.44000244140625}, {"text": "실제로 조직이 혹은 임원들이 팀장들이 개선해야 될 과제를", "start": 107.44000244140625, "end": 112.58000183105469}, {"text": "노출하게 됩니다", "start": 112.58000183105469, "end": 113.36000061035156}, {"text": "그래서 매년 매년 이걸 반복적으로 서베이하고 피드백하는 시스템이", "start": 114.45999908447266, "end": 118.41999816894531}, {"text": "전형적인 기술통계 중심의 조직진단 방식이라고 볼 수 있습니다", "start": 118.41999816894531, "end": 124.19999694824219}, {"text": "저희 인사이트룸은 이런 경험을 토대로 지금 보신 화면처럼", "start": 125.54000091552734, "end": 129.1199951171875}, {"text": "약 100만 명 이상의 응답자들을 갖고 있고요", "start": 129.1199951171875, "end": 134.32000732421875}, {"text": "1000개 이상의 프로젝트 경험 보고서 생성했던 경험을 토대로", "start": 134.32000732421875, "end": 138.5399932861328}, {"text": "다양한 패턴을 추출해서 지금 적용하고 있습니다", "start": 138.5399932861328, "end": 142.3800048828125}, {"text": "지금 보시는 화면이 한 예인데요", "start": 142.77999877929688, "end": 145.16000366210938}, {"text": "몰입도의 유형을 네 가지로 저희가 패턴화 시켰습니다", "start": 145.6199951171875, "end": 149.89999389648438}, {"text": "실제로 상당히 의미가 있는 거고요", "start": 150.4199981689453, "end": 151.8800048828125}, {"text": "보시는 것처럼 네 가지 패턴은 제일 왼쪽에 있는", "start": 152.5800018310547, "end": 155.89999389648438}, {"text": "가장 몰입도가 높은 유형서부터 여기는 모든 몰입이 높습니다", "start": 155.89999389648438, "end": 159.44000244140625}, {"text": "제일 오른쪽에 있는 조용한 사직 추천 의지도 낮고", "start": 159.44000244140625, "end": 163.89999389648438}, {"text": "성장감도 없는데 나는 그만두지 않겠다라고 하는 그런 패턴을", "start": 163.89999389648438, "end": 168.5}, {"text": "보이는 구성원도 있습니다", "start": 168.5, "end": 169.60000610351562}, {"text": "저희가 주목하는 지점은 왼쪽에서 두 번째에 있는 주의", "start": 170.27999877929688, "end": 174.16000366210938}, {"text": "필요 유형입니다", "start": 174.16000366210938, "end": 175.24000549316406}, {"text": "일반 유형도 그만두지 않는데 저희가 발견한 결론은 주의", "start": 175.82000732421875, "end": 180.60000610351562}, {"text": "필요 유형에 있는 사람들은 전체 퇴직의 약 60", "start": 180.60000610351562, "end": 184.22000122070312}, {"text": " 인력이 여기서 발생한다는 겁니다", "start": 184.22000122070312, "end": 185.8800048828125}, {"text": "그러면 밑에 보시는 화면처럼 빨간색이 많은 조직의 임원은", "start": 186.8800048828125, "end": 193.1999969482422}, {"text": "특별히 이걸 관리를 해야 되겠죠", "start": 193.1999969482422, "end": 194.75999450683594}, {"text": "그래서 그쪽으로 한번 들어가보면 다음", "start": 195.3800048828125, "end": 197.4199981689453}, {"text": "장표는 들어간 내용들입니다", "start": 197.4199981689453, "end": 199.22000122070312}, {"text": "보시게 되면 왜 빨간지 그리고 이 빨간색을 줄이려면", "start": 199.55999755859375, "end": 203.77999877929688}, {"text": "어떻게 해야 될지에 대한 구체적인 가이드를 시뮬레이터 할", "start": 203.77999877929688, "end": 207.1199951171875}, {"text": "수 있습니다", "start": 207.1199951171875, "end": 207.60000610351562}, {"text": "오른쪽 아래 보시는 것처럼 주의 필요", "start": 208.63999938964844, "end": 210.4199981689453}, {"text": "유형이 높으면 안 좋은 거죠", "start": 210.4199981689453, "end": 212.67999267578125}, {"text": "주의 필요를 낮추기 위해서 시뮬레이션 평가 보상을 올릴", "start": 212.67999267578125, "end": 217.24000549316406}, {"text": "수 있습니다", "start": 217.24000549316406, "end": 217.89999389648438}, {"text": "이게 올려서 빨간색이 내려가는 정도하고 조직의 아레나를 조정해서", "start": 218.97999572753906, "end": 224.94000244140625}, {"text": "빨간색을 내려가는 정도하고는 차이가 확연합니다", "start": 224.94000244140625, "end": 228.9199981689453}, {"text": "즉 어떤 임원은 평가 보상에 대한 만족도를 높여서", "start": 229.4600067138672, "end": 233.1199951171875}, {"text": "즉 임금 수준을 높이고 보상을 높인다고 해도 주의", "start": 233.1199951171875, "end": 238.6999969482422}, {"text": "필요 유형이 감소되지 않고요", "start": 238.6999969482422, "end": 241.0}, {"text": "오히려 내부의 아레나를 명확히 하는 게 훨씬 더", "start": 241.0, "end": 244.1199951171875}, {"text": "주의 필요", "start": 244.1199951171875, "end": 244.60000610351562}, {"text": "유형을 줄일 수 있다는 시사점을 두고 있는 거고", "start": 244.60000610351562, "end": 248.1999969482422}, {"text": "다른 조직은 또 다른 요인에 의해서 주의 필요", "start": 248.1999969482422, "end": 251.60000610351562}, {"text": "유형을 줄일 수가 있습니다", "start": 251.60000610351562, "end": 253.1999969482422}, {"text": "그래서 모든 조직별로 각각 다른 솔루션 혹은 각각", "start": 254.1999969482422, "end": 258.44000244140625}, {"text": "다른 개선안들을 생성할 때 쉐막은 큰 도움을 줄", "start": 258.44000244140625, "end": 263.29998779296875}, {"text": "수 있을 거로 판단하고 있습니다", "start": 263.29998779296875, "end": 265.0}, {"text": "감사합니다", "start": 265.9200134277344, "end": 266.1600036621094}];
  </script>
  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    // PIP entry
    tl.from("#pip-frame", { scale: 0.7, opacity: 0, duration: 0.6, ease: "power2.out" }, 0.8);

    // Captions: inject DOM + opacity-only toggle on the same timeline.
    const groups = window.__CAPTION_GROUPS || [];
    const capRoot = document.getElementById("captions");
    groups.forEach((g, i) => {
      const row = document.createElement("div");
      row.id = "cg-" + i;
      row.className = "caption-row";
      const inner = document.createElement("span");
      inner.className = "caption-group";
      inner.textContent = g.text;
      row.appendChild(inner);
      capRoot.appendChild(row);
    });
    groups.forEach((g, i) => {
      const sel = "#cg-" + i;
      tl.set(sel, { opacity: 1 }, g.start);
      tl.set(sel, { opacity: 0 }, g.end);
    });

    window.__timelines["ch04-work"] = tl;
  </script>
</div>
