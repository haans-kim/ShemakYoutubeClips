<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <title>Shemak Ch04 — 조직 및 리더십 진단 (작업용)</title>
  <style>
    html, body { margin: 0; padding: 0; background: #000000; }
    #comp-1 { background: #000000; }

    /* Background: iPhone dashboard recording */
    #comp-1 #bg-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      z-index: 1;
    }

    /* PIP: same look as final composition */
    #comp-1 #pip-frame {
      position: absolute;
      left: 1640px;
      top: 740px;
      width: 240px;
      height: 300px;
      border-radius: 10px;
      overflow: hidden;
      z-index: 50;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.30);
    }
    #comp-1 #pip-frame video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      /* Color correction — Sony talking-head was a bit dark/desaturated. */
      filter: brightness(1.20) contrast(1.08) saturate(1.05);
    }

    /* Captions */
    #comp-1 #captions {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 80px;
      pointer-events: none;
      z-index: 60;
    }
    #comp-1 .caption-row {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      text-align: center;
      opacity: 0;
    }
    #comp-1 .caption-group {
      display: inline-block;
      background: rgba(40, 44, 52, 0.85);
      color: #FFFFFF;
      padding: 14px 28px;
      border-radius: 10px;
      font-family: "Pretendard", "Apple SD Gothic Neo", sans-serif;
      font-weight: 600;
      font-size: 38px;
      letter-spacing: -0.01em;
      line-height: 1.35;
      max-width: 1500px;
    }
  </style>
</head>
<body>

<div id="comp-1" data-composition-id="ch04-work"
     data-start="0" data-duration="267.8"
     data-width="1920" data-height="1080">

  <!-- Background: iPhone dashboard recording (muted; PIP carries audio) -->
  <video id="bg-video"
         data-start="0" data-duration="267.8" data-track-index="0"
         src="derived/dashboard.mp4"
         muted playsinline></video>

  <!-- PIP wrapper with audio (same look as final). Animate the wrapper, not the video. -->
  <div id="pip-frame">
    <video id="pip-video"
           data-start="0" data-duration="267.8" data-track-index="1"
           data-has-audio="true"
           src="derived/pip.mp4"
           playsinline
           data-volume="1"></video>
  </div>

  <!-- Caption container (groups injected at composition init) -->
  <div id="captions"></div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    window.__CAPTION_GROUPS = [{"text": "좋은 날 되시길 바랍니다", "start": 0.0, "end": 2.1}, {"text": "오늘은 조직 진단 즉 과거에는 주로 기술 통계", "start": 2.74, "end": 6.58}, {"text": "중심으로 조직 진단을 해왔는데 그 조직 진단과 쉐막이", "start": 6.58, "end": 11.46}, {"text": "예측하는 방식이 어떻게 다른지를 보여드리려고 시간을 마련했습니다", "start": 11.46, "end": 15.9}, {"text": "지금 보신 화면이 전형적으로 저희가 조직 진단할 때", "start": 16.48, "end": 20.08}, {"text": "쓰고 있는 프레임워크라고 보시면 됩니다", "start": 20.08, "end": 21.94}, {"text": "왼쪽에 보시는 게 인풋 요소로서 가치가 얼마나 잘", "start": 22.84, "end": 26.9}, {"text": "내재화되어 있는가 가운데는 스루풋이라고 표현하죠", "start": 26.9, "end": 30.64}, {"text": "가치를 실천하고 있는 환경이 얼마나 잘 구성원들을 만족시키고 있는가", "start": 31.0, "end": 35.06}, {"text": "그 결과 제일 오른쪽에 보이시는 것처럼", "start": 35.06, "end": 40.32}, {"text": "조직 몰입으로 연결됩니다", "start": 40.32, "end": 41.24}, {"text": "즉 이게 최종적인 종속 변수죠", "start": 41.5, "end": 43.6}, {"text": "조직 몰입도를 높이는 게 사실은 모든 인사관리 담당자", "start": 44.1, "end": 47.6}, {"text": "혹은 리더들이 해야 될 일이라고 보고 있습니다", "start": 47.6, "end": 49.42}, {"text": "이 틀대로 실제로 서베이를 저희가 오랫동안 했는데", "start": 50.1, "end": 53.82}, {"text": "전형적인 보고서를 생성하는 방식은 지금 보시는 화면과 같습니다", "start": 54.42, "end": 58.7}, {"text": "위에 몰입도가 있죠", "start": 59.5, "end": 60.62}, {"text": "몰입도의 절대 점수하고 특정 시점에 다른 회사들이 갖고", "start": 61.22, "end": 67.16}, {"text": "있는 점수랑 비교를 하게 됩니다", "start": 67.16, "end": 68.6}, {"text": "norm이 있는 거죠", "start": 68.84, "end": 69.58}, {"text": "인사이트그룹은 기본적으로 매년 약 10만여 명이 서베이를 하고", "start": 69.98, "end": 74.36}, {"text": "있습니다 영역별로 비교 집단인 norm이 존재합니다", "start": 74.36, "end": 78.06}, {"text": "그래서 보시는 것처럼 각 소분류별로 문항별로 비교군 대비", "start": 78.06, "end": 83.86}, {"text": "어떠한가 전년대비 어떠한가라는 차이를 먼저 분석을 하고요", "start": 83.86, "end": 88.58}, {"text": "다음에 두 가지를 분석합니다", "start": 88.58, "end": 89.82}, {"text": "상관과 회귀를 분석합니다", "start": 90.08, "end": 91.5}, {"text": "몰입도와 예를 들면 왼쪽에 있는 조직 가치의", "start": 92.78, "end": 96.32}, {"text": "세부 항목들이 비교군 대비는 어떠하고 전년대비는 어떠하고 몰입도와", "start": 96.32, "end": 102.2}, {"text": "상관계수는 어떠한가 등등을 파악을 해서 의미 있는 영역들을 찾아내어서", "start": 102.2, "end": 107.44}, {"text": "실제로 조직이 혹은 임원들이 팀장들이 개선해야 될 과제를", "start": 107.44, "end": 112.58}, {"text": "도출하게 됩니다", "start": 112.58, "end": 113.36}, {"text": "그래서 매년 매년 이걸 반복적으로 서베이하고 피드백하는 시스템이", "start": 114.46000000000001, "end": 118.42}, {"text": "전형적인 기술통계 중심의 조직진단 방식이라고 볼 수 있습니다", "start": 118.42, "end": 124.2}, {"text": "저희 인사이트그룹은 이런 경험을 토대로 지금 보신 화면처럼", "start": 125.54, "end": 129.12}, {"text": "약 100만 명 이상의 응답자들을 갖고 있고요", "start": 129.12, "end": 134.32}, {"text": "1000개 이상의 프로젝트 경험 보고서 생성했던 경험을 토대로", "start": 134.32, "end": 138.54}, {"text": "다양한 패턴을 추출해서 지금 적용하고 있습니다", "start": 138.54, "end": 142.38}, {"text": "지금 보시는 화면이 한 예인데요", "start": 142.78, "end": 145.16}, {"text": "몰입도의 유형을 네 가지로 저희가 패턴화 시켰습니다", "start": 145.62, "end": 149.9}, {"text": "실제로 상당히 의미가 있는 거고요", "start": 150.42000000000002, "end": 151.88}, {"text": "보시는 것처럼 네 가지 패턴은 제일 왼쪽에 있는", "start": 152.57999999999998, "end": 155.9}, {"text": "가장 몰입도가 높은 유형서부터 여기는 모든 몰입이 높습니다", "start": 155.9, "end": 159.44}, {"text": "제일 오른쪽에 있는 조용한 사직 추천 의지도 낮고", "start": 159.44, "end": 163.9}, {"text": "성장감도 없는데 나는 그만두지 않겠다라고 하는 그런 패턴을", "start": 163.9, "end": 168.5}, {"text": "보이는 구성원도 있습니다", "start": 168.5, "end": 169.6}, {"text": "저희가 주목하는 지점은 왼쪽에서 두 번째에 있는", "start": 170.28, "end": 174.16}, {"text": "주의 필요 유형입니다", "start": 174.16, "end": 175.24}, {"text": "일반 유형도 그만두지 않는데 저희가 발견한 결론은", "start": 175.82, "end": 180.6}, {"text": "주의 필요 유형에 있는 사람들은 전체 퇴직의", "start": 180.6, "end": 184.22}, {"text": "약 60% 인력이 여기서 발생한다는 겁니다", "start": 184.22, "end": 185.88}, {"text": "그러면 밑에 보시는 화면처럼 빨간색이 많은 조직의 임원은", "start": 186.88, "end": 193.2}, {"text": "특별히 이걸 관리를 해야 되겠죠", "start": 193.2, "end": 194.76}, {"text": "그래서 그쪽으로 한번 들어가보면", "start": 195.38, "end": 197.42000000000002}, {"text": "다음 장표는 들어간 내용들입니다", "start": 197.42000000000002, "end": 199.22}, {"text": "보시게 되면 왜 빨간지 그리고 이 빨간색을 줄이려면", "start": 199.56, "end": 203.78}, {"text": "어떻게 해야 될지에 대한 구체적인 가이드를 시뮬레이터", "start": 203.78, "end": 207.12}, {"text": "할 수 있습니다", "start": 207.12, "end": 207.6}, {"text": "오른쪽 아래 보시는 것처럼 주의 필요", "start": 208.64, "end": 210.42000000000002}, {"text": "유형이 높으면 안 좋은 거죠", "start": 210.42000000000002, "end": 212.68}, {"text": "주의 필요를 낮추기 위해서 시뮬레이션 평가 보상을", "start": 212.68, "end": 217.24}, {"text": "올릴 수 있습니다", "start": 217.24, "end": 217.9}, {"text": "이게 올려서 빨간색이 내려가는 정도하고 조직의 아레나를 조정해서", "start": 218.98, "end": 224.94}, {"text": "빨간색이 내려가는 정도하고는 차이가 확연합니다", "start": 224.94, "end": 228.92000000000002}, {"text": "즉 어떤 임원은 평가 보상에 대한 만족도를 높여서", "start": 229.46, "end": 233.12}, {"text": "즉 임금 수준을 높이고 보상을 높인다고 해도", "start": 233.12, "end": 238.7}, {"text": "주의 필요 유형이 감소되지 않고요", "start": 238.7, "end": 241.0}, {"text": "오히려 내부의 아레나를 명확히 하는 게 훨씬 더", "start": 241.0, "end": 244.12}, {"text": "주의 필요", "start": 244.12, "end": 244.6}, {"text": "유형을 줄일 수 있다는 시사점을 두고 있는 거고", "start": 244.6, "end": 248.2}, {"text": "다른 조직은 또 다른 요인에 의해서 주의 필요", "start": 248.2, "end": 251.6}, {"text": "유형을 줄일 수가 있습니다", "start": 251.6, "end": 253.2}, {"text": "그래서 모든 조직별로 각각 다른 솔루션 혹은 각각", "start": 254.2, "end": 258.44}, {"text": "다른 개선안들을 생성할 때 쉐막은 큰 도움을", "start": 258.44, "end": 263.3}, {"text": "줄 수 있을 거로 판단하고 있습니다", "start": 263.3, "end": 265.0}, {"text": "감사합니다", "start": 265.92, "end": 266.16}];
  </script>
  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    // PIP entry
    tl.from("#pip-frame", { scale: 0.7, opacity: 0, duration: 0.6, ease: "power2.out" }, 0.8);

    // Captions: inject DOM + opacity-only toggle on the same timeline.
    const groups = window.__CAPTION_GROUPS || [];
    const capRoot = document.getElementById("captions");
    groups.forEach((g, i) => {
      const row = document.createElement("div");
      row.id = "cg-" + i;
      row.className = "caption-row";
      const inner = document.createElement("span");
      inner.className = "caption-group";
      inner.textContent = g.text;
      row.appendChild(inner);
      capRoot.appendChild(row);
    });
    groups.forEach((g, i) => {
      const sel = "#cg-" + i;
      tl.set(sel, { opacity: 1 }, g.start);
      tl.set(sel, { opacity: 0 }, g.end);
    });

    window.__timelines["ch04-work"] = tl;
  </script>
</div>

</body>
</html>
