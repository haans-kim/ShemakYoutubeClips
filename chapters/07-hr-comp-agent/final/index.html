text": "그래서 지금 보시는 화면처럼 모든 내용을 다 넣습니다", "start": 99.56, "end": 103.78}, {"text": "즉 전제는 왼쪽 위에 보시는 것처럼 인상 재원은 통제합니다", "start": 103.78, "end": 108.08}, {"text": "총액이 예를 들면 3.5%고", "start": 108.08, "end": 111.58}, {"text": "약 3억 정도가 주어진 기본급 인상 재원이다", "start": 111.58, "end": 114.52000000000001}, {"text": "그렇게 한다면 평가 등급이 몇 개인가가", "start": 115.08, "end": 117.84}, {"text": "첫 번째 함수인 것처럼 보이고요", "start": 117.84, "end": 119.02000000000001}, {"text": "보상 전략의 몇 퍼센타일을 지향해야 되는가가 중요하게 됩니다", "start": 119.72, "end": 123.26}, {"text": "그러고 나게 되면 고성과자와 설문조사 결과 그 사람이", "start": 123.26, "end": 129.06}, {"text": "갖고 있는 의식의 패턴이 어떠한 패턴인가", "start": 129.06, "end": 132.34}, {"text": "고모래평인가 아니면 저모래평인가 혹은 조용한 사직 유형인가에 따라서", "start": 132.84, "end": 137.76}, {"text": "저희가 다르게 대응해야 된다는 거죠", "start": 137.76, "end": 139.48}, {"text": "그리고 모든 시뮬레이션을 한 다음에 개별적으로 직군이나", "start": 139.48, "end": 145.24}, {"text": "이 사람들이 갖고 있는 직군이나 이 사람이 갖고 있는 스킬", "start": 145.24, "end": 148.57999999999998}, {"text": "혹은 직무의 속성을 따라서 외부의 오픈마켓에 있는", "start": 148.57999999999998, "end": 153.92000000000002}, {"text": "소스들을 임금 소스들을 잘 긁어와서 크롤링해서", "start": 153.92000000000002, "end": 159.86}, {"text": "여기다 부어넣습니다 그러고 나면 AI가 예측해주는 알고리즘을 저희 쉐막은", "start": 159.86, "end": 165.44}, {"text": "내부에 장착되어 있는 상황입니다", "start": 165.44, "end": 167.28}, {"text": "그래서 기본적으로 여러 가지 레버들 혹은 시뮬레이션", "start": 167.28, "end": 172.16}, {"text": "할 수 있는 여러 가지 변수들만 움직이게 되면 누구한테", "start": 172.16, "end": 176.24}, {"text": "얼마를 주는 게 최적인가가 초안을 작성하게 됩니다", "start": 176.24, "end": 179.66}, {"text": "이거는 직원이 100명이든 직원이 1만 명이든 금방 시뮬레이션", "start": 180.4, "end": 185.24}, {"text": "결과를 보여드릴 수가 있습니다", "start": 185.24, "end": 187.3}, {"text": "그럴 경우에 전체의 인건비가 통제된 하에서 전체 구성원 중에", "start": 187.3, "end": 193.14}, {"text": "직급별 인력의 유형별 혹은 그 사람의 평가 등급별", "start": 193.14, "end": 197.28}, {"text": "임금 인상률 기본급 인상률이 얼마가 되어야 되는가가", "start": 197.28, "end": 202.66}, {"text": "쉐막이 제공하는 가장 중요한 기능 중에 하나라고 생각하고 있습니다", "start": 202.66, "end": 208.54}, {"text": "이걸 저희는 HR 에이전트라고 부르고 있고", "start": 208.54, "end": 212.76}, {"text": "HR 헤드 혹은 어떤 HR 실제로 운영하고 있는 전문가들이", "start": 212.76, "end": 216.8}, {"text": "반드시 사용하면 전략적으로 의사결정할 때 충분히 여러분을", "start": 216.8, "end": 222.6}, {"text": "도와드릴 수 있는 기능이라고 저희는 강력히 추천드리고 싶습니다", "start": 222.6, "end": 226.06}, {"text": "감사합니다", "start": 226.92000000000002, "end": 227.12}];

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    // PIP entry — settles by ~1.4s
    tl.from("#pip-frame", { scale: 0.7, opacity: 0, duration: 0.6, ease: "power2.out" }, 0.8);

    // Slide crossfades (next slide fades in over 0.4s at its data-start).
    tl.from("#s2", { opacity: 0, duration: 0.4, ease: "none" }, 65);
    tl.from("#s3", { opacity: 0, duration: 0.4, ease: "none" }, 103);
    tl.from("#s4", { opacity: 0, duration: 0.4, ease: "none" }, 142);
    tl.from("#s5", { opacity: 0, duration: 0.4, ease: "none" }, 190);

    // Captions: inject DOM + opacity-only toggle on the same timeline.
    const groups = window.__CAPTION_GROUPS || [];
    const capRoot = document.getElementById("captions");
    groups.forEach((g, i) => {
      const row = document.createElement("div");
      row.id = "cg-" + i;
      row.className = "caption-row";
      const inner = document.createElement("span");
      inner.className = "caption-group";
      inner.textContent = g.text;
      row.appendChild(inner);
      capRoot.appendChild(row);
    });
    groups.forEach((g, i) => {
      const sel = "#cg-" + i;
      tl.set(sel, { opacity: 1 }, g.start);
      tl.set(sel, { opacity: 0 }, g.end);
    });

    window.__timelines["ch07"] = tl;
