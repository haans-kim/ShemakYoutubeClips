  <script>
    window.__CAPTION_GROUPS = [{"text": "잘 되시기를 바랍니다", "start": 0.0, "end": 1.1200000047683716}, {"text": "오늘은 저희 인사이트 그룹의 20년 된 직무디비", "start": 3.359999895095825, "end": 6.880000114440918}, {"text": "업무디비 KPIDB 스킬디비가", "start": 7.71999979019165, "end": 11.260000228881836}, {"text": "고객의 특정한 팀 맥락에서 어떻게 구현되는지를 보여드리는 시간이라고", "start": 12.399999618530273, "end": 17.739999771118164}, {"text": "보시면 됩니다", "start": 17.739999771118164, "end": 18.760000228881836}, {"text": "기존에 학습되어진 데이터셋을 토대로 팀장과 팀원이 일정한 기간을", "start": 19.34000015258789, "end": 26.139999389648438}, {"text": "가지고 한 달에 한 번 혹은 일주일에 한", "start": 26.139999389648438, "end": 30.420000076293945}, {"text": "번 정도 대화를 할 수가 있을 겁니다", "start": 30.420000076293945, "end": 32.15999984741211}, {"text": "그 대화 로그를 저희 Shemak에 업로드 하시면 업로드한", "start": 32.599998474121094, "end": 39.400001525878906}, {"text": "걸 토대로 바로바로 지금 보신 화면처럼 이 매뉴얼이", "start": 39.400001525878906, "end": 45.34000015258789}, {"text": "만들어지게 되고요", "start": 45.34000015258789, "end": 46.439998626708984}, {"text": "채용이다 그러면 채용이 하는 일이 만들어지게 되고 각", "start": 47.040000915527344, "end": 50.900001525878906}, {"text": "구성원들이 채용에 필요한 매뉴얼이 뭐고 채용에 필요한 스킬이", "start": 50.900001525878906, "end": 56.5}, {"text": "뭐고 이 채용의 KPI는 뭐다", "start": 56.5, "end": 59.36000061035156}, {"text": "그리고 특별히 이 구성원이 갖고 있는 스킬 수준이", "start": 60.2400016784668, "end": 63.459999084472656}, {"text": "어떠하다가 바로 업로드 되어서 팀장과 팀원이 동시에 같이", "start": 63.459999084472656, "end": 69.36000061035156}, {"text": "볼 수가 있습니다", "start": 69.36000061035156, "end": 70.16000366210938}, {"text": "그리고 이게 팀 단위로 모으게 되면 모든 구성원들의", "start": 72.5999984741211, "end": 77.4000015258789}, {"text": "KPI와 스킬이 다 정리되어서 개인별로 확인이 되어진다면 지금", "start": 77.4000015258789, "end": 82.05999755859375}, {"text": "보시는 화면은 팀장 화면인데요", "start": 82.05999755859375, "end": 83.68000030517578}, {"text": "팀장은 모든 구성원들의 대시보드를 다 모아서 본인 이", "start": 84.4000015258789, "end": 90.5}, {"text": "구성원들의 현재 KPI 수준이 어떠할지 향후에 어떻게 움직일지를", "start": 90.5, "end": 95.0999984741211}, {"text": "다 예측하고 관리하고 누가 무슨 일을 해야 되는지가", "start": 95.0999984741211, "end": 99.5999984741211}, {"text": "이 한눈에 볼 수 있는 팀장 대시보드를 만들어", "start": 99.5999984741211, "end": 103.19999694824219}, {"text": "드릴 수가 있습니다", "start": 103.19999694824219, "end": 104.12000274658203}, {"text": "이게 저희가 얘기하는 팀장 에이전트 이고요", "start": 104.4000015258789, "end": 107.80000305175781}, {"text": "이걸 토대로 전체 모으면 본부장 에이전트 다음에 더", "start": 108.0199966430664, "end": 114.62000274658203}, {"text": "모으면 CEO 에이전트로 올라가는 내용이라고 보시면 될 것", "start": 114.62000274658203, "end": 118.86000061035156}, {"text": "같습니다 특히 이 기능이 중요한 것은 이 중에서", "start": 118.86000061035156, "end": 123.63999938964844}, {"text": "저희가 인원이 한두 명이 빠지거나 혹은 장기 휴가를", "start": 123.63999938964844, "end": 128.97999572753906}, {"text": "가거나 할 때 이 업무를 재배분하게 될 겁니다", "start": 128.97999572753906, "end": 131.75999450683594}, {"text": "업무를 재배분하게 되면 기존에 하고 있던 구성원들의 업무", "start": 132.3800048828125, "end": 137.4600067138672}, {"text": "매뉴얼들이 그대로 말 한마디에 의해서 혹은 데이터 업로드에", "start": 137.4600067138672, "end": 142.44000244140625}, {"text": "의해서 그 사람한테 가서 현재 쓰고 있는 하고", "start": 142.44000244140625, "end": 146.86000061035156}, {"text": "있는 업무 프로세스가 가서 붙게 되고 쓰고 있는", "start": 146.86000061035156, "end": 149.89999389648438}, {"text": "양식 다음에 스킬 다음에 이 사람의 수준들이 바로", "start": 149.89999389648438, "end": 154.60000610351562}, {"text": "바로 정리가 되는 가장 큰 특징이 있고요", "start": 154.60000610351562, "end": 156.60000610351562}, {"text": "또 하나는 저희 딥이랑 결합이 되어지면 모든 구성원들의", "start": 157.1199951171875, "end": 160.74000549316406}, {"text": "현재 수준의 스킬과 다른 회사랑 대비했을 경우에 보유한", "start": 160.74000549316406, "end": 166.33999633789062}, {"text": "스킬의 수준이 어떻다", "start": 166.33999633789062, "end": 167.9199981689453}, {"text": "등등을 예측할 수 있는 특징이 되게 됩니다", "start": 167.9199981689453, "end": 170.0}, {"text": "궁극적으로는 이게 잡 디스크립션 즉 직무기 수상도 바로", "start": 172.25999450683594, "end": 175.44000244140625}, {"text": "연동이 되고요", "start": 175.44000244140625, "end": 176.25999450683594}, {"text": "포지션 프로파일하고도 바로 연동이 되게 됩니다", "start": 176.67999267578125, "end": 178.8800048828125}, {"text": "공석이 되어서 채용이 필요할 경우에는 여기에 있는 잡", "start": 179.8000030517578, "end": 184.89999389648438}, {"text": "디스크립션이나 포지션 프로파일이 그대로 채용 공고서로 바로 활용할", "start": 184.89999389648438, "end": 189.5800018310547}, {"text": "수 있는 수준까지 돌아가는게 HR 에이전트의 어떤 팀장용", "start": 189.5800018310547, "end": 194.52000427246094}, {"text": "에이전트라고 보시면 될 것 같습니다", "start": 194.52000427246094, "end": 197.02000427246094}, {"text": "이게 쇠마그만이 갖고 있는 즉 데이터베이스가 충분히 존재하고", "start": 197.44000244140625, "end": 201.63999938964844}, {"text": "있고 그거를", "start": 201.63999938964844, "end": 202.8800048828125}, {"text": "AI가 잘 읽어서 저희 갖고 있는 딥러닝 알고리즘에", "start": 204.22000122070312, "end": 208.44000244140625}, {"text": "잘 확인을 해서 두가지가 결합이 되어지면 아주 유용한", "start": 208.44000244140625, "end": 212.5800018310547}, {"text": "그리고 팀장님의 일을 엄청나게 많이 도와드리는 물건이 된다라고", "start": 212.5800018310547, "end": 217.25999450683594}, {"text": "저희는 판단하고 있습니다", "start": 217.25999450683594, "end": 218.36000061035156}, {"text": "감사합니다", "start": 218.9600067138672, "end": 219.27999877929688}];
  </script>
  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    // PIP entry
    tl.from("#pip-frame", { scale: 0.7, opacity: 0, duration: 0.6, ease: "power2.out" }, 0.8);

    // Captions: inject DOM + opacity-only toggle on the same timeline.
    const groups = window.__CAPTION_GROUPS || [];
    const capRoot = document.getElementById("captions");
    groups.forEach((g, i) => {
      const row = document.createElement("div");
      row.id = "cg-" + i;
      row.className = "caption-row";
      const inner = document.createElement("span");
      inner.className = "caption-group";
      inner.textContent = g.text;
      row.appendChild(inner);
      capRoot.appendChild(row);
    });
    groups.forEach((g, i) => {
      const sel = "#cg-" + i;
      tl.set(sel, { opacity: 1 }, g.start);
      tl.set(sel, { opacity: 0 }, g.end);
    });

    window.__timelines["ch05-work"] = tl;
  </script>
</div>
