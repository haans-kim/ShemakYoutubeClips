<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <title>Shemak Ch03 — 역량 스킬 모니터링 (작업용)</title>
  <style>
    html, body { margin: 0; padding: 0; background: #000000; }
    #comp-1 { background: #000000; }

    /* Background: iPhone dashboard recording */
    #comp-1 #bg-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      z-index: 1;
    }

    /* PIP: same look as final composition */
    #comp-1 #pip-frame {
      position: absolute;
      left: 1640px;
      top: 740px;
      width: 240px;
      height: 300px;
      border-radius: 10px;
      overflow: hidden;
      z-index: 50;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.30);
    }
    #comp-1 #pip-frame video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      /* Color correction — Sony talking-head was a bit dark/desaturated. */
      filter: brightness(1.20) contrast(1.08) saturate(1.05);
    }

    /* Captions */
    #comp-1 #captions {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 80px;
      pointer-events: none;
      z-index: 60;
    }
    #comp-1 .caption-row {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      text-align: center;
      opacity: 0;
    }
    #comp-1 .caption-group {
      display: inline-block;
      background: rgba(40, 44, 52, 0.85);
      color: #FFFFFF;
      padding: 14px 28px;
      border-radius: 10px;
      font-family: "Pretendard", "Apple SD Gothic Neo", sans-serif;
      font-weight: 600;
      font-size: 38px;
      letter-spacing: -0.01em;
      line-height: 1.35;
      max-width: 1500px;
    }
  </style>
</head>
<body>

<div id="comp-1" data-composition-id="ch03-work"
     data-start="0" data-duration="201.8"
     data-width="1920" data-height="1080">

  <!-- Background: iPhone dashboard recording (muted; PIP carries audio) -->
  <video id="bg-video"
         data-start="0" data-duration="201.8" data-track-index="0"
         src="derived/dashboard.mp4"
         muted playsinline></video>

  <!-- PIP wrapper with audio (same look as final). Animate the wrapper, not the video. -->
  <div id="pip-frame">
    <video id="pip-video"
           data-start="0" data-duration="201.8" data-track-index="1"
           data-has-audio="true"
           src="derived/pip.mp4"
           playsinline
           data-volume="1"></video>
  </div>

  <!-- Caption container (groups injected at composition init) -->
  <div id="captions"></div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    window.__CAPTION_GROUPS = [{"text": "좋은 날 되시기를 바랍니다", "start": 0.0, "end": 1.6799999475479126}, {"text": "오늘은 전체 구성원의 스킬을 잘 찾아내고 그 레벨을", "start": 4.119999885559082, "end": 9.600000381469727}, {"text": "정의할 것인가에 초점을 맞춘 쉐막을 설명드리고자 합니다", "start": 9.600000381469727, "end": 12.880000114440918}, {"text": "지금 보시는 화면은 전사가 필요한 역량이 어떻게 찾아나가는가를", "start": 13.779999732971191, "end": 20.6200008392334}, {"text": "구현한 쉐막의 대시보드 화면이라고 보시면 됩니다", "start": 20.6200008392334, "end": 23.5}, {"text": "기본적으로는 저희 인사이트 그룹이 20년간 수행했던 컨설팅 때", "start": 24.280000686645508, "end": 28.860000610351562}, {"text": "확인했던 스킬 DB 직무 DB", "start": 29.8799991607666, "end": 32.08000183105469}, {"text": "조직 역량 DB와 기능 DB들이 집약되어 있는 풀을", "start": 32.779998779296875, "end": 37.20000076293945}, {"text": "잘 활용했다고 보시면 됩니다", "start": 37.20000076293945, "end": 38.7599983215332}, {"text": "지금 보신 화면이 비즈니스 펑션 모델에서", "start": 39.279998779296875, "end": 42.599998474121094}, {"text": "특정한 기능을 누르면 필요한 잡이 나오고요", "start": 43.279998779296875, "end": 47.2400016784668}, {"text": "그 잡별로 필요한 스킬이 무엇이다가", "start": 47.34000015258789, "end": 50.560001373291016}, {"text": "본원 쪽으로 DB에서 저희 제시를 해드립니다", "start": 51.599998474121094, "end": 53.900001525878906}, {"text": "제시를 해드린 다음에 다음", "start": 54.720001220703125, "end": 56.7599983215332}, {"text": "보시는 것처럼 구체적으로 특정한 인력이 저 요구되어지는 앞서", "start": 56.7599983215332, "end": 62.86000061035156}, {"text": "설명드렸던 화면에서 요구되어지는 스킬 DB 얼마나 보유하고 있는가를", "start": 62.86000061035156, "end": 69.72000122070312}, {"text": "측정해서 한눈에 보여드리는 모양이 되게 됩니다", "start": 69.72000122070312, "end": 72.08000183105469}, {"text": "그 결과 최종적으로는 예를 들면 특정 기능에 있어서", "start": 73.0, "end": 79.08000183105469}, {"text": "지금 보시는 것처럼 여기는 빨간색이 모자란 데고요", "start": 79.08000183105469, "end": 83.31999969482422}, {"text": "파란색이 충분한 데라고 보시면 될 것 같습니다", "start": 83.41999816894531, "end": 85.33999633789062}, {"text": "이걸 전체 구성원들이 갖고 있는 보유한 스킬의 수준들을", "start": 85.33999633789062, "end": 90.5199966430664}, {"text": "다 더하면 회사가 요구하는 혹은 경쟁력 있는 수준", "start": 90.5199966430664, "end": 93.86000061035156}, {"text": "대비 얼만큼 갖고 있는가를 지금 보신 화면처럼 대시보도화", "start": 93.86000061035156, "end": 98.05999755859375}, {"text": "시킬 수가 있습니다", "start": 98.05999755859375, "end": 98.95999908447266}, {"text": "이렇게 대시보도화 된 것을 토대로", "start": 99.76000213623047, "end": 102.36000061035156}, {"text": "구성원들과 이야기하면서", "start": 104.12000274658203, "end": 105.95999908447266}, {"text": "팀장이 구성원들과 원온온을 통해서 이 사람의 스킬셋이 어떻게", "start": 107.4000015258789, "end": 112.12000274658203}, {"text": "변하고 있는지를 추적하고 모니터링하고 또한 동일한 스킬을 갖고", "start": 112.12000274658203, "end": 117.9000015258789}, {"text": "있는 다른 회사 대비 얼만큼 있는가 등등을 보여주는", "start": 117.9000015258789, "end": 122.19999694824219}, {"text": "가장 중요한 내용이라고 볼 수 있겠습니다", "start": 122.36000061035156, "end": 124.72000122070312}, {"text": "지난 시간에 설명드렸던 것처럼", "start": 126.0199966430664, "end": 127.95999908447266}, {"text": "인력이 모자라다", "start": 128.47999572753906, "end": 129.94000244140625}, {"text": "남는다 바쁘다", "start": 130.1999969482422, "end": 131.94000244140625}, {"text": "등등은 사실은 최종적으로는 구성원이 보유한 스킬에 의존하기도 합니다", "start": 131.94000244140625, "end": 137.25999450683594}, {"text": "그래서 전체 인력이 얼마나 필요할 것인가를 예측하는 기능", "start": 138.22000122070312, "end": 140.89999389648438}, {"text": "현재 어느 부서가 많이 바쁘거나 그리고 특정 월이나", "start": 140.89999389648438, "end": 144.8800048828125}, {"text": "특정 시간에는", "start": 144.8800048828125, "end": 146.13999938964844}, {"text": "특정 기능이 바쁘구나를 예측도 가능하고 실제로 지난달에 누가", "start": 146.82000732421875, "end": 150.9600067138672}, {"text": "바빴는지도 모니터링이 가능합니다", "start": 150.9600067138672, "end": 153.0399932861328}, {"text": "그 이면에는 질적인 요소인 구성원의 스킬들이 얼마를 갖고", "start": 153.60000610351562, "end": 158.24000549316406}, {"text": "있는가 구성원의 스킬이 우리가 요구하는 수준을 갖고 있는가가", "start": 158.24000549316406, "end": 161.89999389648438}, {"text": "중요한 변수라는 걸 잊으면 안 됩니다", "start": 161.89999389648438, "end": 163.4199981689453}, {"text": "그래서 이 세 가지의 관점 예측하는 부서나 기능에", "start": 164.86000061035156, "end": 170.5399932861328}, {"text": "따른 기능에 필요한 인력 동인에 따른 예측과", "start": 170.5399932861328, "end": 173.8000030517578}, {"text": "구체적인 행동 지난달에 근무했던 기록들 데이터를 가지고 실제로", "start": 175.02000427246094, "end": 180.10000610351562}, {"text": "얼마나 바쁜가에 대한 기록 그 일을 수행하는 구성원들이", "start": 180.10000610351562, "end": 184.52000427246094}, {"text": "스킬이 보유 수준이 어떠한가가 종합적으로 판단되어야 우리 향후에", "start": 184.52000427246094, "end": 189.3800048828125}, {"text": "필요한 인력들이 몇 명이나 될 건지 어떤 인력이", "start": 189.3800048828125, "end": 191.97999572753906}, {"text": "얼만큼 부족한지 혹은 여유가 있는지가 판단되는 쇠막의 기능을", "start": 191.97999572753906, "end": 197.5399932861328}, {"text": "지금 제가 보여드렸습니다", "start": 197.5399932861328, "end": 199.05999755859375}, {"text": "감사합니다", "start": 199.82000732421875, "end": 199.94000244140625}];
  </script>
  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    // PIP entry
    tl.from("#pip-frame", { scale: 0.7, opacity: 0, duration: 0.6, ease: "power2.out" }, 0.8);

    // Captions: inject DOM + opacity-only toggle on the same timeline.
    const groups = window.__CAPTION_GROUPS || [];
    const capRoot = document.getElementById("captions");
    groups.forEach((g, i) => {
      const row = document.createElement("div");
      row.id = "cg-" + i;
      row.className = "caption-row";
      const inner = document.createElement("span");
      inner.className = "caption-group";
      inner.textContent = g.text;
      row.appendChild(inner);
      capRoot.appendChild(row);
    });
    groups.forEach((g, i) => {
      const sel = "#cg-" + i;
      tl.set(sel, { opacity: 1 }, g.start);
      tl.set(sel, { opacity: 0 }, g.end);
    });

    window.__timelines["ch03-work"] = tl;
  </script>
</div>

</body>
</html>
