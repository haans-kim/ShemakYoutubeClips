<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <title>Shemak Ch02 — 근무 적정성 모니터링</title>
  <style>
    html, body { margin: 0; padding: 0; background: #FFFFFF; }
    #comp-1 { background: #FFFFFF; }

    #comp-1 .slide {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #FFFFFF;
    }

    #comp-1 #pip-frame {
      position: absolute;
      left: 1640px;
      top: 740px;
      width: 240px;
      height: 300px;
      border-radius: 10px;
      overflow: hidden;
      z-index: 50;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.30);
    }
    #comp-1 #pip-frame video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      /* Color correction — Sony talking-head was a bit dark/desaturated. */
      filter: brightness(1.20) contrast(1.08) saturate(1.05);
    }

    #comp-1 #captions {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 80px;
      pointer-events: none;
      z-index: 60;
    }
    #comp-1 .caption-row {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      text-align: center;
      opacity: 0;
    }
    #comp-1 .caption-group {
      display: inline-block;
      background: rgba(40, 44, 52, 0.85);
      color: #FFFFFF;
      padding: 14px 28px;
      border-radius: 10px;
      font-family: "Pretendard", "Apple SD Gothic Neo", sans-serif;
      font-weight: 600;
      font-size: 38px;
      letter-spacing: -0.01em;
      line-height: 1.35;
      max-width: 1500px;
    }
  </style>
</head>
<body>

<div id="comp-1" data-composition-id="ch02"
     data-start="0" data-duration="246.3"
     data-width="1920" data-height="1080">

  <!-- Slides on track 0. data-start in seconds; durations from 효단님 docx timing notes. -->
  <img id="s1"  class="clip slide" data-start="0"   data-duration="95"   data-track-index="0" src="slides/Clip 2 - 01.png" style="z-index: 4" />
  <img id="s2"  class="clip slide" data-start="95"  data-duration="4"    data-track-index="0" src="slides/Clip 2 - 02 - 1.png" style="z-index: 4" />
  <img id="s3"  class="clip slide" data-start="99"  data-duration="68"   data-track-index="0" src="slides/Clip 2 - 02 - 2 (Scroll down).png" style="z-index: 4" />
  <img id="s4"  class="clip slide" data-start="167" data-duration="79.3" data-track-index="0" src="slides/Clip 2 - 03.png" style="z-index: 4" />

  <!-- PIP wrapper with audio (full duration). Animate the wrapper, not the video. -->
  <div id="pip-frame" style="z-index: 50">
    <video id="pip-video"
           data-start="0" data-duration="246.3" data-track-index="1"
           data-has-audio="true"
           src="derived/pip.mp4"
           playsinline
           data-volume="1"></video>
  </div>

  <!-- Caption container (groups injected at composition init) -->
  <div id="captions"></div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    window.__CAPTION_GROUPS = [{"text": "좋은 날 되시기를 바랍니다", "start": 0.84, "end": 2.94}, {"text": "이번 시간에는 우리가 일하는 게 적정한가 저 부서는", "start": 3.42, "end": 8.5}, {"text": "왜 바쁜가 저 사람은 얼마나 바쁜가를 추정해 나가는", "start": 8.5, "end": 12.42}, {"text": "AI Shemak을 보여드리려고 합니다", "start": 13.0, "end": 15.62}, {"text": "지금 보시는 화면이", "start": 16.72, "end": 17.8}, {"text": "큰 기업의 위에 횡으로 보여주는 조직이 임원 조직이고요", "start": 18.74, "end": 23.6}, {"text": "오른쪽에 보이는 왼쪽에 보이는 레벨이 직급이라고 보시면 됩니다", "start": 23.88, "end": 27.94}, {"text": "색깔이 빨갛게 보이는 영역은", "start": 28.52, "end": 30.64}, {"text": "지금 무척 바쁜 조직이라고 보시면 되고요", "start": 31.34, "end": 33.78}, {"text": "파랗게 보이는 조직은 비교적 여유가 있는 조직이다", "start": 34.34, "end": 38.02}, {"text": "초록색은 적정하다라고 판단하고 있는 내용입니다", "start": 38.4, "end": 41.56}, {"text": "여기 보시게 되면 근태 시간이라는 게 존재합니다", "start": 42.36, "end": 46.08}, {"text": "근태 시간은 구성원들이 출근해서 퇴근할 때까지의", "start": 46.62, "end": 49.64}, {"text": "법적인 휴게시간을 포함한 근태 시간을 의미하고요", "start": 50.22, "end": 53.16}, {"text": "저희가 초점을 맞추고 빨간색 파란색", "start": 53.72, "end": 56.26}, {"text": "초록색을 보이게 되는 것은 주간 근무 추정 시간을", "start": 57.18, "end": 60.92}, {"text": "근거로 합니다", "start": 60.92, "end": 61.66}, {"text": "주간 근무 추정 시간이라고 하는 것은 야근을 하더라도", "start": 62.4, "end": 65.6}, {"text": "실제로 안 바쁠 수도 있고요", "start": 65.6, "end": 67.22}, {"text": "정시 출근", "start": 67.8, "end": 68.3}, {"text": "정시 퇴근하더라도 무척 바쁜 사람도 있다고 가정하고 있습니다", "start": 68.82, "end": 72.74}, {"text": "그러면 그걸 어떻게 추정할 것인가가 진정 어려운 과제가 되겠죠", "start": 73.56, "end": 77.02}, {"text": "똑같이 한 사람이 같은 시간대에 같은 장소에", "start": 77.02, "end": 81.52}, {"text": "앉아있는데 누구는 일을 바쁘게 하고 있고 누구는 여유가", "start": 81.52, "end": 84.36}, {"text": "있다는 걸 추정해 나가는 게 무척 어려운 작업입니다", "start": 84.36, "end": 87.62}, {"text": "이거는 저희는 지금 보시는 화면처럼", "start": 87.92, "end": 91.12}, {"text": "조직이 갖고 있는 여러 가지 데이터들이 있습니다", "start": 92.53999999999999, "end": 96.03999999999999}, {"text": "데이터들을 분석을 해서 개인들이 수행하고 있는 일이", "start": 96.97999999999999, "end": 101.68}, {"text": "혹은 액티버트들이 이게 이 데이터 값과 연결되어지면 이 사람이", "start": 101.68, "end": 105.58}, {"text": "지금 일하고 있다", "start": 105.58, "end": 106.52000000000001}, {"text": "아니면 지금 일을 하고 있지 않다라는 판단하게 됩니다", "start": 106.86, "end": 109.97999999999999}, {"text": "이때 첫 번째로는 500명이 있거나 300명이 있거나 1000명이", "start": 110.97999999999999, "end": 114.82}, {"text": "있을 경우에 패턴을 분류하는 방식을 취합니다", "start": 114.82, "end": 117.44}, {"text": "즉 외부에서 활동을 많이 하는 영업 직원 같은 경우에", "start": 117.92, "end": 122.38}, {"text": "보여주는 패턴", "start": 122.38, "end": 123.22}, {"text": "연구소처럼 장비라든지 혼자 생각을 많이 하고 시간이", "start": 124.58, "end": 128.42}, {"text": "많이 있는 패턴 등 패턴이 무척 다릅니다", "start": 128.42, "end": 130.82}, {"text": "그러면 똑같은 액티버트나 똑같은 데이터가 오더라도 이걸 해석할 때", "start": 131.18, "end": 135.04}, {"text": "똑같은 모니터를 주시하는 행위 자체가 어떤 사람한테는", "start": 135.04, "end": 140.06}, {"text": "근무하고 있다고 판단이 되어지고요", "start": 140.06, "end": 141.52}, {"text": "어떤 분은 근무하고 있지 않다라고 판단하는 패턴을 인식하게 됩니다", "start": 141.88, "end": 145.1}, {"text": "이 데이터를 일간 단위 데이터로 받아올 수", "start": 145.1, "end": 149.94}, {"text": "있는 게 있고요", "start": 149.94, "end": 150.62}, {"text": "주간 단위로 받아올 수 있는 게 있고", "start": 150.92000000000002, "end": 153.62}, {"text": "월간 단위로 다운로드 받을 수 있는 데이터가 있습니다", "start": 153.62, "end": 155.44}, {"text": "이거를 모델링을 합니다", "start": 155.6, "end": 157.04}, {"text": "개인별로 모델링도 가능하고 기능별로 모델링도 가능합니다", "start": 158.1, "end": 161.76}, {"text": "이거를 지금 보시는 화면처럼 주간 단위로 월간 단위로", "start": 162.0, "end": 165.7}, {"text": "모델링한 게 최종적으로 보여주는 대시보드의 역할이라고 보시면 됩니다", "start": 166.96, "end": 171.62}, {"text": "그러면 이 대시보드에 빨간색이 나올 경우에는 두 가지", "start": 172.07, "end": 175.94}, {"text": "이유가 있을 것처럼 보입니다", "start": 175.94, "end": 177.06}, {"text": "하나는 진짜 업무량이 많다", "start": 177.4, "end": 179.52}, {"text": "지난 시간에 보여드렸던 근무 인력 동인이 너무 많아서", "start": 180.02, "end": 184.4}, {"text": "바쁠 수가 있고요", "start": 184.4, "end": 185.26}, {"text": "두 번째로는 일을 하고 있는 사람 구성원의 스킬 세트가", "start": 185.6, "end": 190.2}, {"text": "부서나 기능이 요구하고 있는 스킬 세트와 맞지 않을 경우에", "start": 190.68, "end": 194.8}, {"text": "빨간색이 될 수가 있습니다", "start": 194.8, "end": 195.9}, {"text": "파란색도 반대로 해석하면 됩니다", "start": 197.57999999999998, "end": 199.44}, {"text": "인력 동인이 혹시 적거나 즉 업무의 부하가 적거나", "start": 200.07999999999998, "end": 204.84}, {"text": "두 번째로는 스킬세트가 너무 잘 맞아서 혹은 스킬에 대한한", "start": 204.84, "end": 209.32}, {"text": "숙련도가 무척 높아서 일을 빨리 끝낼 수도", "start": 209.32, "end": 212.7}, {"text": "있는 거죠", "start": 212.7, "end": 213.24}, {"text": "이 첫 번째 보여드렸던 적정 인력 관련된", "start": 213.66, "end": 218.84}, {"text": "인력 동인 방식과", "start": 218.86, "end": 220.34}, {"text": "다음 시간에 설명드릴 구성원의 개인 스킬을 종합적으로 판단해야", "start": 220.34, "end": 224.72}, {"text": "빨간색이냐 초록색이냐", "start": 225.42000000000002, "end": 227.96}, {"text": "파란색이냐가 엄밀히 해석할 수 있을 것처럼 보입니다", "start": 228.57999999999998, "end": 232.9}, {"text": "그래서 이 대시보드를 매월 누적시키면서", "start": 233.5, "end": 236.51}, {"text": "다음 달은 어떻게 될 것인가를 예측해나가는 작업", "start": 236.96, "end": 240.22}, {"text": "이게 쉐막이 도와드릴 수 있는 영역이라고 생각합니다", "start": 240.68, "end": 243.44}, {"text": "감사합니다", "start": 244.16, "end": 244.4}];
  </script>
  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    // PIP entry — settles by ~1.4s
    tl.from("#pip-frame", { scale: 0.7, opacity: 0, duration: 0.6, ease: "power2.out" }, 0.8);

    // Slide crossfades (next slide fades in over 0.4s at its data-start).
    tl.from("#s2", { opacity: 0, duration: 0.4, ease: "none" }, 95);
    tl.from("#s3", { opacity: 0, duration: 0.4, ease: "none" }, 99);
    tl.from("#s4", { opacity: 0, duration: 0.4, ease: "none" }, 167);

    // Captions: inject DOM + opacity-only toggle on the same timeline.
    const groups = window.__CAPTION_GROUPS || [];
    const capRoot = document.getElementById("captions");
    groups.forEach((g, i) => {
      const row = document.createElement("div");
      row.id = "cg-" + i;
      row.className = "caption-row";
      const inner = document.createElement("span");
      inner.className = "caption-group";
      inner.textContent = g.text;
      row.appendChild(inner);
      capRoot.appendChild(row);
    });
    groups.forEach((g, i) => {
      const sel = "#cg-" + i;
      tl.set(sel, { opacity: 1 }, g.start);
      tl.set(sel, { opacity: 0 }, g.end);
    });

    window.__timelines["ch02"] = tl;
  </script>
</div>

</body>
