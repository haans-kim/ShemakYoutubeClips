  <style>

<body>

<div id="comp-1" data-composition-id="ch06"

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    window.__CAPTION_GROUPS = [{"text": "지난 시간에는 팀장 AI Agent에 대해서 Shemak이 갖고", "start": 1.0, "end": 6.64}, {"text": "있는 내용들을 설명드렸습니다", "start": 6.64, "end": 8.12}, {"text": "모든 팀장들이 팀원들과 적절한 대화를 통하면 IGDB랑 결합이", "start": 9.58, "end": 16.14}, {"text": "되어서 매뉴얼 직무기술서", "start": 16.14, "end": 18.64}, {"text": "스킬에 대한 디스크립션 그리고 외부 스킬과의 비교 등등이", "start": 19.64, "end": 23.08}, {"text": "가능하다고 제가 말씀을 드렸습니다", "start": 23.08, "end": 24.7}, {"text": "그 결과가 지금 보시는 화면으로 지배하게 되게 됩니다", "start": 25.54, "end": 28.7}, {"text": "전사 차원에서 어느 기능이 지금 빨간색인지 어느 기능이", "start": 28.7, "end": 35.5}, {"text": "그린라이트인지 어느 기능이 파란색인지가 보이게 되는 거죠", "start": 35.5, "end": 39.04}, {"text": "즉 한 명의 구성원이 이탈을 하거나 새로운 인력이", "start": 39.26, "end": 42.2}, {"text": "들어오게 되면 직급별로", "start": 42.2, "end": 44.5}, {"text": "스킬별로 어떤 모양을 지니게 된다라는 게 보여주는 전사", "start": 44.96, "end": 49.84}, {"text": "스킬 혹은 조직 역량 대시보드라고 보면 되겠습니다", "start": 49.84, "end": 53.0}, {"text": "그래서 빨간색은 가능하면 새로운 인력을 충원하거나 내부에서 재배치를", "start": 53.0, "end": 58.38}, {"text": "해야 되는 근거가 되는 겁니다", "start": 58.38, "end": 60.42}, {"text": "그래서 파란색은 인력이 좀 여유가 있기 때문에 여기", "start": 61.28, "end": 64.02}, {"text": "있는 인력들을 다른 직무로 전환시키거나 다른 부서로 혹은", "start": 64.02, "end": 68.12}, {"text": "다른 기능으로 움직이도 된다라는 어떤 액션을 취할 수", "start": 68.12, "end": 72.08}, {"text": "있을 것처럼 보입니다", "start": 72.08, "end": 73.14}, {"text": "이게 역량의 이야기라면 또 하나는 CEO라든지 임원 입장에서는", "start": 73.6, "end": 79.46000000000001}, {"text": "지금 보시는 화면처럼 KPI도 관련되어 있습니다", "start": 79.46000000000001, "end": 83.94}, {"text": "그래서 팀장과 팀원들이 바텀업으로 정기적으로 대화한 데이터를 기반으로", "start": 85.46000000000001, "end": 91.24}, {"text": "각 본부나 각 팀들의 바텀업 KPIs에 대한 추론도", "start": 91.24, "end": 97.62}, {"text": "AI 쉐막은 가능합니다", "start": 97.62, "end": 99.4}, {"text": "물론 전사에서 내려오는 지표들 즉 재무에서 생산되어지는 기본적인", "start": 99.4, "end": 106.5}, {"text": "재무역에서 생산되어지는 지표들이라든지 재무에서 생산된 지표들도 탑다운 방식으로", "start": 106.5, "end": 111.9}, {"text": "각 본부나 각 팀 혹은 각 기능별 지표와", "start": 111.9, "end": 115.6}, {"text": "결합이 되게 됩니다", "start": 115.6, "end": 116.38}, {"text": "그래서 이걸 토대로 시뮬레이션도 가능하게 됩니다", "start": 116.38, "end": 120.98}, {"text": "현재처럼이라면 우리가 목표하는 영업이익은 어떻게 될 것인가 에비단은", "start": 121.46, "end": 126.36}, {"text": "어떻게 될 것인가 등등에 대한 시뮬레이션이 가능합니다", "start": 126.36, "end": 129.54}, {"text": "매출이라든지 원가 절감이라든지 혁신 등이 계획대로 이루어진다면 지금", "start": 130.46, "end": 136.07999999999998}, {"text": "시뮬레이션이 발을 움직이게 되면 향후의 즉 연말에 우리가", "start": 136.07999999999998, "end": 141.12}, {"text": "목표하는 목표가 얼마나 잘 달성할 수 있는가를 체계적으로", "start": 141.12, "end": 145.32}, {"text": "보여주는 대시보드가 CEO 레벨 임원 레벨한테 주어지게 됩니다", "start": 145.32, "end": 149.94}, {"text": "그래서 기본적으로는 바텀업 방식으로 저희 DB를 활용해서 모든", "start": 151.4, "end": 155.46}, {"text": "구성원들의 업무와 직무와 스킬들 KPIs를 다 놓치지 않고", "start": 155.46, "end": 162.04}, {"text": "다 찾게 되고요", "start": 162.04, "end": 163.0}, {"text": "예측도 가능하게 되고 업로드나 에이징도 순간순간 이루어지게 됩니다", "start": 163.64, "end": 168.4}, {"text": "이걸 토대로 다음", "start": 168.4, "end": 170.28}, {"text": "단계인 임원급 다음에 CEO급한테도 스킬이나 역량의 KPIs에 대한", "start": 170.28, "end": 176.6}, {"text": "정보들이 전달되어서 의사결정을 할 수 있는 중요한 AI", "start": 176.6, "end": 181.08}, {"text": "에이전트를 제공하는 게 저희 인사이트 그룹 쇠망만이 제공할", "start": 181.08, "end": 185.72}, {"text": "수 있는 중요한 서비스가 아닌가라고 생각을 하고 있습니다", "start": 185.72, "end": 189.52}, {"text": "감사합니다", "start": 190.44, "end": 190.68}];
  </script>
  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    // PIP entry — settles by ~1.4s
    tl.from("#pip-frame", { scale: 0.7, opacity: 0, duration: 0.6, ease: "power2.out" }, 0.8);

    // Slide crossfades (next slide fades in over 0.4s at its data-start).
    tl.from("#s2", { opacity: 0, duration: 0.4, ease: "none" }, 79);
    tl.from("#s3", { opacity: 0, duration: 0.4, ease: "none" }, 121);
    tl.from("#s4", { opacity: 0, duration: 0.4, ease: "none" }, 148);

    // Captions: inject DOM + opacity-only toggle on the same timeline.
    const groups = window.__CAPTION_GROUPS || [];
    const capRoot = document.getElementById("captions");
    groups.forEach((g, i) => {
      const row = document.createElement("div");
      row.id = "cg-" + i;
      row.className = "caption-row";
      const inner = document.createElement("span");
      inner.className = "caption-group";
      inner.textContent = g.text;
      row.appendChild(inner);
      capRoot.appendChild(row);
    });
    groups.forEach((g, i) => {
      const sel = "#cg-" + i;
      tl.set(sel, { opacity: 1 }, g.start);
      tl.set(sel, { opacity: 0 }, g.end);
    });

    window.__timelines["ch06"] = tl;
  </script>
</div>
